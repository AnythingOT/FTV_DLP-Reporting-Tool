name: release
# Publish a release on GitHub (Releases -> Draft a new release) with a tag like
# v1.0.2 that matches VERSION in dlpreport/app_info.py. This workflow then builds
# DLPReport.exe and attaches it, with a SHA-256 checksum, to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check tag matches app version
        run: |
          $version = python -c "from dlpreport.app_info import VERSION; print(VERSION)"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected -and -not $env:GITHUB_REF_NAME.StartsWith("$expected-")) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match VERSION $version in dlpreport/app_info.py"
            exit 1
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DLPReport --collect-data sv_ttk main.py

      - name: Checksum
        working-directory: dist
        run: |
          $hash = (Get-FileHash DLPReport.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DLPReport.exe" | Out-File -Encoding ascii DLPReport.exe.sha256
          Get-Content DLPReport.exe.sha256

      - name: Attach exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME dist/DLPReport.exe dist/DLPReport.exe.sha256 --clobber
