name: release
# Push a tag like v1.0.2 (matching VERSION in dlpreport/app_info.py) to build
# DLPReport.exe and publish it as a GitHub release. Tags with a hyphen
# (e.g. v1.1.0-rc1) are published as pre-releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check tag matches app version
        run: |
          $version = python -c "from dlpreport.app_info import VERSION; print(VERSION)"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected -and -not $env:GITHUB_REF_NAME.StartsWith("$expected-")) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match VERSION $version in dlpreport/app_info.py"
            exit 1
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DLPReport --collect-data sv_ttk main.py

      - name: Checksum
        working-directory: dist
        run: |
          $hash = (Get-FileHash DLPReport.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DLPReport.exe" | Out-File -Encoding ascii DLPReport.exe.sha256
          Get-Content DLPReport.exe.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $flags = @("--title", "DataLogPro Report Tool $tag", "--generate-notes", "--verify-tag")
          if ($tag.Contains("-")) { $flags += "--prerelease" }
          gh release create $tag dist/DLPReport.exe dist/DLPReport.exe.sha256 @flags
